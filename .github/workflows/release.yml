name: Release
on:
  push:
    branches: [release]
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: UoMResearchIT/Actions/create-release@Josh-Woodcock/create-release
        id: release
        with:
          version-file: MyApp/appsettings.json
          version-pattern: '"VersionNumber"\s*:\s*"([^"]+)"'
          tag: Release_v{version}
          title: v{version}
          milestone: v{version}
      - run: echo "version=$V tag=$T previous=$P created=$C url=$U"
        env:
          V: ${{ steps.release.outputs.version }}
          T: ${{ steps.release.outputs.tag }}
          P: ${{ steps.release.outputs.previous-tag }}
          C: ${{ steps.release.outputs.created }}
          U: ${{ steps.release.outputs.release-url }}
