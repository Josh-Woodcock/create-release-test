name: Release
on:
  push:
    branches: [release]
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      created: ${{ steps.release.outputs.created }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: UoMResearchIT/Actions/create-release@Josh-Woodcock/create-release
        id: release
        with:
          version-file: MyApp/appsettings.json
          version-pattern: '"VersionNumber"\s*:\s*"([^"]+)"'
          tag: Release_v{version}
          title: v{version}
          milestone: v{version}

  deploy:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - name: Pretend to deploy
        run: |
          echo "Deploying $TAG"
          echo "Checked-out commit: $(git rev-parse HEAD)"
          grep VersionNumber MyApp/appsettings.json
        env:
          TAG: ${{ needs.release.outputs.tag }}
